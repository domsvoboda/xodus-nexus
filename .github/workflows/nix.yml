name: Nix flake

on:
  push:
    branches: [feat/nix-flake]
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'src/main/runtime.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nix.yml'
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check flake outputs and build launcher
        run: nix flake check -L
      - name: Build pinned official Nexus Proton runtime
        run: nix build .#nexus-runtime -L
      - name: Verify packaged Wine binary exists
        run: test -f result/files/bin/wine
