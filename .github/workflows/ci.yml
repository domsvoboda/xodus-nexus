name: CI

on:
  push:
    branches: [main, develop]
    # Approval metadata promotes existing bytes; it must not rebuild the launcher.
    paths-ignore: [.github/release-validation.json]
  pull_request:
    paths-ignore: [.github/release-validation.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install account-free runtime fixture toolchain
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" scripts/ci/ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-mingw-w64-x86-64
      - name: Check source without compiling a distribution candidate
        if: github.ref != 'refs/heads/main'
        run: npm run typecheck && npm run test
      - name: Build and check the main candidate once
        if: github.ref == 'refs/heads/main'
        run: npm run build
      - run: npm run test:runtime-tools
      - run: npm run test:ci-tools
      - name: Set up QEMU for the aarch64 helper build
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build the nexus-close-window helper for both CPUs
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 20
        # The daemon runs this X11 helper to ask a game to close before it falls
        # back to signals. Packaged from build/tools/<arch>/ by the after-pack hook.
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends libx11-dev
          mkdir -p build/tools/x86_64 build/tools/aarch64
          cc -std=c99 -Wall -Wextra -Werror -O2 -o build/tools/x86_64/nexus-close-window scripts/runtime-tools/nexus-close-window.c -lX11
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src arm64v8/ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o Acquire::Retries=3 update
            apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential libx11-dev file
            cc -std=c99 -Wall -Wextra -Werror -O2 -o build/tools/aarch64/nexus-close-window scripts/runtime-tools/nexus-close-window.c -lX11
            file build/tools/aarch64/nexus-close-window | grep -q aarch64
            chown -R "$(stat -c %u:%g /src)" build/tools'
          file build/tools/x86_64/nexus-close-window | grep -q x86-64
      - name: Build launcher candidate (never publish)
        if: github.ref == 'refs/heads/main'
        run: npx --no-install electron-builder --linux AppImage --x64 --arm64 --publish never
      - name: Bind candidate to source and checksums
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/artifact-manifest.mjs write launcher release
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: launcher-candidate
          path: |
            release/*.AppImage
            release/*.AppImage.sha512sum
            release/candidate.json
          if-no-files-found: error
          retention-days: 3
