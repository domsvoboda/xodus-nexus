name: CI

on:
  push:
    branches: [main, develop]
    # Approval metadata promotes existing bytes; it must not rebuild the launcher.
    paths-ignore: [.github/release-validation.json]
  pull_request:
    paths-ignore: [.github/release-validation.json]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Launcher candidate architectures'
        type: choice
        options: [both, x64]
        default: both
      bridge_043_candidate:
        description: 'One-off launcher 0.4.3 transition candidate; valid only on fix/launcher-repo-bridge-0411'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # A requested maintenance candidate proves its exact source before any
      # dependency installation or build step starts. Other events are unaffected.
      - name: Validate the one-off 0.4.3 bridge candidate request
        id: bridge
        env:
          BRIDGE_043_REQUESTED: ${{ inputs.bridge_043_candidate || 'false' }}
        run: node scripts/ci/bridge-043-preflight.mjs
      - run: npm ci
      - name: Install account-free runtime fixture toolchain
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" scripts/ci/ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-mingw-w64-x86-64
      - name: Check source without compiling a distribution candidate
        if: steps.bridge.outputs.candidate != 'true' && (github.ref != 'refs/heads/main' || contains(github.event.head_commit.message, '[source-only]'))
        run: npm run i18n:check && npm run typecheck && npm run test
      - name: Build and check the launcher candidate once
        if: (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')) || (steps.bridge.outputs.candidate == 'true' && github.ref == 'refs/heads/fix/launcher-repo-bridge-0411')
        run: npm run build
      - run: npm run test:runtime-tools
      - run: npm run test:ci-tools
      - name: Build launcher candidate (never publish)
        if: (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')) || (steps.bridge.outputs.candidate == 'true' && github.ref == 'refs/heads/fix/launcher-repo-bridge-0411')
        env:
          BUILD_ARCHITECTURE: ${{ inputs.architecture || 'both' }}
        run: |
          case "$BUILD_ARCHITECTURE" in
            x64) npx --no-install electron-builder --linux AppImage --x64 --publish never ;;
            both) npx --no-install electron-builder --linux AppImage --x64 --arm64 --publish never ;;
            *) echo 'Unsupported launcher architecture selection' >&2; exit 1 ;;
          esac
      - name: Bind candidate to source and checksums
        if: (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')) || (steps.bridge.outputs.candidate == 'true' && github.ref == 'refs/heads/fix/launcher-repo-bridge-0411')
        run: node scripts/ci/artifact-manifest.mjs write launcher release
      - uses: actions/upload-artifact@v4
        if: (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')) || (steps.bridge.outputs.candidate == 'true' && github.ref == 'refs/heads/fix/launcher-repo-bridge-0411')
        with:
          name: launcher-candidate
          path: |
            release/*.AppImage
            release/*.AppImage.sha512sum
            release/candidate.json
          if-no-files-found: error
          retention-days: 3
