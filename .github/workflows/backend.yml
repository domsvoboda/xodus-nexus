name: Nexus backend build

on:
  push:
    branches: [main]
    paths: [assets/backend-source.lock.json, 'assets/xodus-*.patch', scripts/build-backend.mjs, scripts/backend-source-archive.mjs, 'scripts/ci/**', .github/workflows/backend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc 2.35 baseline on both architectures.
          - runner: ubuntu-22.04
            suffix: x86_64
          - runner: ubuntu-22.04-arm
            suffix: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read pinned Rust version
        run: |
          echo "BACKEND_RUST=$(node -p 'require("./assets/backend-source.lock.json").rust')" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.BACKEND_RUST }}
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev protobuf-compiler libdbus-1-dev dbus-daemon tar xz-utils
      - name: Build and test pinned source, package binaries and corresponding source
        env:
          XZ_OPT: '-T2'
        run: node scripts/build-backend.mjs --work "$PWD/backend-build" --output "$PWD/backend-release"
      - name: Confirm the package names this architecture
        run: ls backend-release | grep -- "-linux-${{ matrix.suffix }}.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-backend-${{ matrix.suffix }}
          path: backend-release/*
          if-no-files-found: error
          retention-days: 7

  candidate:
    # One candidate carries both architectures; promotion publishes them in one release.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-backend-*
          merge-multiple: true
          path: backend-release
      - name: Bind both architectures to exact workflow source and bytes
        run: node scripts/ci/artifact-manifest.mjs write backend backend-release
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-backend
          path: backend-release/*
          if-no-files-found: error
          retention-days: 7
