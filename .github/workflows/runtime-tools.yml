name: Nexus runtime tools

# Checks the small Linux helpers the Nexus daemon runs next to the game
# (scripts/runtime-tools/*.c): source policy tests plus an x86_64 build smoke
# tested under Xvfb. The shipped x86_64 binary is built by
# ci.yml and packaged into the launcher.

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/runtime-tools/**'
      - .github/workflows/runtime-tools.yml
  pull_request:
    paths:
      - 'scripts/runtime-tools/**'
      - .github/workflows/runtime-tools.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source policy tests
        run: node --test scripts/runtime-tools/nexus-close-window.test.mjs

  x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and smoke test prerequisites
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" scripts/ci/ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            build-essential libx11-dev xvfb xauth xterm xfonts-base file
      - name: Build nexus-close-window (x86_64)
        run: |
          mkdir -p out/x86_64
          cc -std=c99 -Wall -Wextra -Werror -O2 -o out/x86_64/nexus-close-window scripts/runtime-tools/nexus-close-window.c -lX11
          file out/x86_64/nexus-close-window | grep -q 'x86-64'
      - name: Smoke test under Xvfb
        timeout-minutes: 5
        run: xvfb-run -a bash scripts/runtime-tools/nexus-close-window-smoke.sh "$PWD/out/x86_64/nexus-close-window"

